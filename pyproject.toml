[project]
name = "family-assistant"
version = "0.1.0"
description = "Family Telegram chat assistant: archives chat content and answers questions via Claude"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "anthropic>=0.49",
    "faster-whisper>=1.0",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
